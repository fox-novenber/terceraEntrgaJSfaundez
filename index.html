<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tercera.css">
    <title>Verdulería</title>
</head>
<body>
    <header>
        <h1>🥕 VERDULERÍA</h1>
    </header>

    <div class="cajaBuscador">
        <input id="buscador" placeholder="Buscar producto...">
        <button class="filtro activo" data-origen="todos">TODOS</button>
        <button class="filtro" data-origen="importado">IMPORTADOS</button>
        <button class="filtro" data-origen="nacional">NACIONALES</button>
    </div>

    <main>
        <section id="tarjetas"></section>

        <aside class="compras">
            <h2>🛒 Carrito</h2>
            <div id="carrito"></div>
            <p class="total">Total: $<span id="total">0</span></p>
            <button id="vaciar">Vaciar carrito</button>
        </aside>
    </main>

    <script src="terceraEntrega.js"></script>
</body>
</html>
